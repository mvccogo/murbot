x-logging: &rotated-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

services:
  # ==============================================================================
  # Local SOTA Kokoro TTS Service (GPU Accelerated, OpenAI-compatible API)
  # Ultra-natural human tones, pauses, and Brazilian Portuguese voices (pf_dora, pm_alex)
  # ==============================================================================
  kokoro-tts:
    logging: *rotated-logging
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: voice_bot_kokoro
    restart: unless-stopped
    ports:
      - "8880:8880"
    environment:
      - TZ=America/Sao_Paulo
      - USE_GPU=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ==============================================================================
  # Local Offline LLM Service (Ollama with GPU Acceleration)
  # ==============================================================================
  ollama:
    logging: *rotated-logging
    image: ollama/ollama:latest
    container_name: voice_bot_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  # ==============================================================================
  # Optional: Discord Voice Bot Container
  # Run this if you want the bot itself running inside a Docker container
  # ==============================================================================
  discord_bot:
    logging: *rotated-logging
    build: .
    container_name: voice_bot_discord
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LOCAL_LLM_BASE_URL=http://ollama:11434/v1
      - LOCAL_TTS_BASE_URL=http://kokoro-tts:8880/v1
    depends_on:
      - ollama
      - kokoro-tts
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_models:
